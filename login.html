<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Login - Test Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
</head>

<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in with your DataStore credentials</p>
    </div>

    <form id="loginForm" novalidate>
      <div id="generalError" class="alert alert-error" style="display:none;"></div>
      <div id="generalSuccess" class="alert alert-success" style="display:none;"></div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="e.g. user@example.com" autocomplete="email" required />
        <span class="field-error" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" id="togglePassword" class="toggle-pwd" aria-label="Toggle password visibility">👁</button>
        </div>
        <span class="field-error" id="passwordError"></span>
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">
        <span id="btnText">Sign In</span>
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </form>
  </div>

  <script src="login.js"></script>
</body>

</html>
